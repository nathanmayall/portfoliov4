name: CI
on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Format, lint and type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Build
        run: deno task build
